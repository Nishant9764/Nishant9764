<svg
  width="1200"
  height="390"
  viewBox="0 0 1200 390"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND                                           -->
    <!-- ===================================================== -->

    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="390">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1200" y2="390">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="progressCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- ===================================================== -->
    <!-- GRID                                                  -->
    <!-- ===================================================== -->

    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 30 0 L 0 0 0 30"
        stroke="#38BDF8"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>

    <!-- ===================================================== -->
    <!-- GLOW                                                   -->
    <!-- ===================================================== -->

    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="smallGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- MAIN BACKGROUND                                       -->
  <!-- ===================================================== -->

  <rect
    x="8"
    y="8"
    width="1184"
    height="374"
    rx="18"
    fill="url(#background)"
  />

  <rect
    x="8"
    y="8"
    width="1184"
    height="374"
    rx="18"
    fill="url(#grid)"
  />

  <!-- ambient glows -->

  <circle
    cx="180"
    cy="190"
    r="250"
    fill="url(#cyanGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.65;1;0.65"
      dur="7s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="1060"
    cy="200"
    r="230"
    fill="url(#purpleGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.5;0.9;0.5"
      dur="8s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ===================================================== -->
  <!-- OUTER FRAME                                           -->
  <!-- ===================================================== -->

  <rect
    x="8"
    y="8"
    width="1184"
    height="374"
    rx="18"
    stroke="url(#borderGradient)"
    stroke-width="1.5"
  />

  <rect
    x="15"
    y="15"
    width="1170"
    height="360"
    rx="14"
    stroke="#38BDF8"
    stroke-opacity="0.06"
  />


  <!-- ===================================================== -->
  <!-- HEADER                                                 -->
  <!-- ===================================================== -->

  <text
    x="38"
    y="43"
    fill="#22D3EE"
    font-family="monospace"
    font-size="11"
    font-weight="700"
    letter-spacing="2"
  >
    IDENTITY_PROTOCOL
  </text>

  <text
    x="250"
    y="43"
    fill="#475569"
    font-family="monospace"
    font-size="10"
  >
    / DEVELOPER_PROFILE
  </text>

  <!-- version -->

  <text
    x="1105"
    y="43"
    fill="#64748B"
    font-family="monospace"
    font-size="9"
  >
    v2.6
  </text>

  <line
    x1="38"
    y1="59"
    x2="1162"
    y2="59"
    stroke="#38BDF8"
    stroke-opacity="0.13"
  />


  <!-- ===================================================== -->
  <!-- LEFT IDENTITY PANEL                                   -->
  <!-- ===================================================== -->

  <rect
    x="38"
    y="78"
    width="525"
    height="265"
    rx="12"
    fill="#020617"
    fill-opacity="0.72"
    stroke="#38BDF8"
    stroke-opacity="0.20"
  />

  <!-- terminal heading -->

  <text
    x="62"
    y="106"
    fill="#64748B"
    font-family="monospace"
    font-size="10"
  >
    nishant@github:~$ whoami
  </text>

  <!-- blinking cursor -->

  <rect
    x="250"
    y="97"
    width="6"
    height="12"
    rx="1"
    fill="#22D3EE"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- name -->

  <text
    x="62"
    y="145"
    fill="#F8FAFC"
    font-family="monospace"
    font-size="30"
    font-weight="700"
    letter-spacing="1"
  >
    NISHANT
  </text>

  <!-- accent -->

  <rect
    x="62"
    y="158"
    width="72"
    height="3"
    rx="1.5"
    fill="url(#cyanGradient)"
  >
    <animate
      attributeName="width"
      values="60;92;72"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- roles -->

  <text
    x="62"
    y="187"
    fill="#38BDF8"
    font-family="monospace"
    font-size="13"
    font-weight="700"
  >
    FULL STACK DEVELOPER
  </text>

  <text
    x="62"
    y="211"
    fill="#A78BFA"
    font-family="monospace"
    font-size="13"
    font-weight="700"
  >
    AI BUILDER
  </text>


  <!-- separator -->

  <line
    x1="62"
    y1="230"
    x2="535"
    y2="230"
    stroke="#38BDF8"
    stroke-opacity="0.10"
  />


  <!-- description -->

  <text
    x="62"
    y="254"
    fill="#CBD5E1"
    font-family="monospace"
    font-size="11"
  >
    I build full-stack applications and explore
  </text>

  <text
    x="62"
    y="273"
    fill="#CBD5E1"
    font-family="monospace"
    font-size="11"
  >
    AI-powered systems — turning ideas into
  </text>

  <text
    x="62"
    y="292"
    fill="#CBD5E1"
    font-family="monospace"
    font-size="11"
  >
    useful, working software.
  </text>


  <!-- philosophy -->

  <text
    x="62"
    y="322"
    fill="#475569"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    BUILD → BREAK → DEBUG → IMPROVE → SHIP
  </text>


  <!-- ===================================================== -->
  <!-- RIGHT SYSTEM PANEL                                    -->
  <!-- ===================================================== -->

  <rect
    x="585"
    y="78"
    width="577"
    height="265"
    rx="12"
    fill="#020617"
    fill-opacity="0.72"
    stroke="#8B5CF6"
    stroke-opacity="0.20"
  />

  <!-- panel title -->

  <text
    x="612"
    y="107"
    fill="#8B5CF6"
    font-family="monospace"
    font-size="11"
    font-weight="700"
    letter-spacing="1"
  >
    CURRENT OPERATING MODE
  </text>

  <circle
    cx="1132"
    cy="102"
    r="5"
    fill="#22C55E"
    filter="url(#smallGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="1050"
    y="106"
    fill="#86EFAC"
    font-family="monospace"
    font-size="9"
  >
    ACTIVE
  </text>


  <!-- focus 01 -->

  <text
    x="612"
    y="142"
    fill="#64748B"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    01 / FOCUS
  </text>

  <text
    x="612"
    y="161"
    fill="#F8FAFC"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    AI / LLM APPLICATIONS
  </text>

  <rect
    x="612"
    y="170"
    width="360"
    height="5"
    rx="2.5"
    fill="#0F172A"
  />

  <rect
    x="612"
    y="170"
    width="270"
    height="5"
    rx="2.5"
    fill="url(#purpleGradient)"
  >
    <animate
      attributeName="width"
      values="255;285;270"
      dur="5s"
      repeatCount="indefinite"
    />
  </rect>

  <text
    x="987"
    y="175"
    fill="#A78BFA"
    font-family="monospace"
    font-size="9"
  >
    EXPLORING
  </text>


  <!-- focus 02 -->

  <text
    x="612"
    y="208"
    fill="#64748B"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    02 / DEPTH
  </text>

  <text
    x="612"
    y="227"
    fill="#F8FAFC"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    BACKEND ENGINEERING
  </text>

  <rect
    x="612"
    y="236"
    width="360"
    height="5"
    rx="2.5"
    fill="#0F172A"
  />

  <rect
    x="612"
    y="236"
    width="245"
    height="5"
    rx="2.5"
    fill="url(#cyanGradient)"
  >
    <animate
      attributeName="width"
      values="230;260;245"
      dur="5.5s"
      repeatCount="indefinite"
    />
  </rect>

  <text
    x="987"
    y="241"
    fill="#38BDF8"
    font-family="monospace"
    font-size="9"
  >
    BUILDING
  </text>


  <!-- focus 03 -->

  <text
    x="612"
    y="274"
    fill="#64748B"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    03 / NEXT
  </text>

  <text
    x="612"
    y="293"
    fill="#F8FAFC"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    SYSTEM DESIGN
  </text>

  <rect
    x="612"
    y="302"
    width="360"
    height="5"
    rx="2.5"
    fill="#0F172A"
  />

  <rect
    x="612"
    y="302"
    width="205"
    height="5"
    rx="2.5"
    fill="url(#cyanGradient)"
  >
    <animate
      attributeName="width"
      values="190;220;205"
      dur="6s"
      repeatCount="indefinite"
    />
  </rect>

  <text
    x="987"
    y="307"
    fill="#38BDF8"
    font-family="monospace"
    font-size="9"
  >
    DEEPENING
  </text>


  <!-- ===================================================== -->
  <!-- BOTTOM STATUS STRIP                                   -->
  <!-- ===================================================== -->

  <line
    x1="585"
    y1="324"
    x2="1162"
    y2="324"
    stroke="#8B5CF6"
    stroke-opacity="0.10"
  />

  <text
    x="612"
    y="337"
    fill="#475569"
    font-family="monospace"
    font-size="8"
    letter-spacing="1"
  >
    MODE: BUILDING / LEARNING / SHIPPING
  </text>


  <!-- ===================================================== -->
  <!-- DECORATIVE TELEMETRY                                  -->
  <!-- ===================================================== -->

  <path
    d="M 1080 350
       L 1090 350
       L 1096 343
       L 1102 350
       L 1110 350
       L 1117 338
       L 1124 350
       L 1135 350
       L 1142 345
       L 1150 350"
    stroke="#22D3EE"
    stroke-width="1.2"
    stroke-opacity="0.45"
    fill="none"
  >
    <animate
      attributeName="stroke-opacity"
      values="0.2;0.8;0.2"
      dur="3s"
      repeatCount="indefinite"
    />
  </path>


  <!-- ===================================================== -->
  <!-- SCAN LINE                                             -->
  <!-- ===================================================== -->

  <rect
    x="30"
    y="70"
    width="1.5"
    height="300"
    fill="#22D3EE"
    opacity="0"
  >
    <animate
      attributeName="x"
      values="30;1170;30"
      dur="11s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;0.35;0"
      dur="11s"
      repeatCount="indefinite"
    />
  </rect>

</svg>

    SHIP
  </text>

  <text
    x="603"
    y="451"
    fill="#334155"
    font-family="Consolas, monospace"
    font-size="9"
  >
    // v1.0
  </text>


  <!-- ===================================================== -->
  <!-- SCAN LINE                                              -->
  <!-- ===================================================== -->

  <rect
    x="25"
    y="70"
    width="2"
    height="410"
    fill="#22D3EE"
    opacity="0"
  >
    <animate
      attributeName="x"
      values="25;735;25"
      dur="10s"

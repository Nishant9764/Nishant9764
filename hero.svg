<svg width="760" height="500" viewBox="0 0 760 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- =========================
         GRID
    ========================== -->

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#38BDF8"
        stroke-opacity="0.055"
        stroke-width="1"
      />
    </pattern>

    <!-- =========================
         NAME CLIP / TYPING
    ========================== -->

    <clipPath id="typingClip">
      <rect x="42" y="151" width="0" height="70">
        <animate
          attributeName="width"
          values="0;0;265;265;0"
          keyTimes="0;0.15;0.55;0.78;1"
          dur="7s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- =========================
         FILTERS
    ========================== -->

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- =========================
         TYPOGRAPHY
    ========================== -->

    <style>

      .display {
        font-family:
          "Trebuchet MS",
          "Segoe UI",
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "SFMono-Regular",
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .label {
        font-family:
          "SFMono-Regular",
          Consolas,
          monospace;
        font-size: 10px;
        letter-spacing: 2px;
      }

      .small {
        font-family:
          "SFMono-Regular",
          Consolas,
          monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }

    </style>

  </defs>


  <!-- =====================================================
       OUTER FRAME
  ====================================================== -->

  <rect
    x="7"
    y="7"
    width="746"
    height="486"
    rx="24"
    fill="url(#bgGradient)"
    stroke="#1E3A56"
    stroke-width="1.5"
  />

  <!-- Ambient glow -->

  <rect
    x="8"
    y="8"
    width="744"
    height="484"
    rx="24"
    fill="url(#cyanGlow)"
  />

  <!-- Grid -->

  <rect
    x="8"
    y="8"
    width="744"
    height="484"
    rx="24"
    fill="url(#grid)"
  />


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <circle cx="34" cy="34" r="5" fill="#22C55E">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="48"
    y="38"
    class="label"
    fill="#94A3B8">
    SYSTEM ONLINE
  </text>

  <text
    x="710"
    y="38"
    text-anchor="end"
    class="label"
    fill="#475569">
    NISHANT.DEV
  </text>


  <!-- top separator -->

  <line
    x1="28"
    y1="57"
    x2="732"
    y2="57"
    stroke="#1E3A56"
    stroke-width="1"
  />


  <!-- =====================================================
       IDENTITY
  ====================================================== -->

  <text
    x="42"
    y="100"
    class="display"
    font-size="16"
    font-weight="600"
    letter-spacing="4"
    fill="#94A3B8">

    HELLO, I'M

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.08;0.16;1"
      dur="7s"
      repeatCount="indefinite"
    />

  </text>


  <!-- =====================================================
       NAME
  ====================================================== -->

  <g clip-path="url(#typingClip)">

    <text
      x="42"
      y="205"
      class="display"
      font-size="68"
      font-weight="800"
      letter-spacing="3"
      fill="url(#nameGradient)">
      NISHANT
    </text>

  </g>


  <!-- Cursor -->

  <rect
    x="318"
    y="151"
    width="5"
    height="64"
    rx="2"
    fill="#22D3EE"
    filter="url(#smallGlow)">

    <animate
      attributeName="opacity"
      values="1;0;1;0"
      dur="0.9s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="x"
      values="42;42;307;307;42"
      keyTimes="0;0.15;0.55;0.78;1"
      dur="7s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- =====================================================
       ROLE
  ====================================================== -->

  <text
    x="44"
    y="235"
    class="display"
    font-size="17"
    font-weight="600"
    letter-spacing="2"
    fill="#F8FAFC">

    FULL STACK
  </text>

  <text
    x="174"
    y="235"
    class="display"
    font-size="17"
    font-weight="600"
    letter-spacing="2"
    fill="#38BDF8">

    ×
  </text>

  <text
    x="195"
    y="235"
    class="display"
    font-size="17"
    font-weight="600"
    letter-spacing="2"
    fill="#A78BFA">

    AI
  </text>


  <!-- small descriptor -->

  <text
    x="44"
    y="260"
    class="small"
    fill="#64748B">

    BUILDING REAL-WORLD SOFTWARE &amp; AI SYSTEMS

  </text>


  <!-- =====================================================
       TERMINAL PANEL
  ====================================================== -->

  <rect
    x="28"
    y="286"
    width="704"
    height="139"
    rx="15"
    fill="#020617"
    fill-opacity="0.72"
    stroke="#17324A"
    stroke-width="1"
  />


  <!-- terminal top -->

  <circle cx="48" cy="307" r="4" fill="#38BDF8"/>
  <circle cx="62" cy="307" r="4" fill="#8B5CF6"/>
  <circle cx="76" cy="307" r="4" fill="#22C55E"/>

  <text
    x="96"
    y="311"
    class="label"
    fill="#475569">
    TERMINAL
  </text>


  <!-- command -->

  <text
    x="48"
    y="343"
    class="mono"
    font-size="13"
    fill="#64748B">
    nishant@github:~$
  </text>

  <text
    x="190"
    y="343"
    class="mono"
    font-size="13"
    fill="#F8FAFC">
    ./status
  </text>


  <!-- status lines -->

  <text
    x="48"
    y="370"
    class="mono"
    font-size="12"
    fill="#64748B">
    &gt;
  </text>

  <text
    x="66"
    y="370"
    class="mono"
    font-size="12"
    fill="#CBD5E1">
    BUILD
  </text>

  <circle cx="145" cy="366" r="4" fill="#22C55E">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>


  <text
    x="190"
    y="370"
    class="mono"
    font-size="12"
    fill="#64748B">
    &gt;
  </text>

  <text
    x="208"
    y="370"
    class="mono"
    font-size="12"
    fill="#CBD5E1">
    LEARN
  </text>

  <circle cx="286" cy="366" r="4" fill="#22C55E">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.8s"
      begin="0.3s"
      repeatCount="indefinite"
    />
  </circle>


  <text
    x="330"
    y="370"
    class="mono"
    font-size="12"
    fill="#64748B">
    &gt;
  </text>

  <text
    x="348"
    y="370"
    class="mono"
    font-size="12"
    fill="#CBD5E1">
    SHIP
  </text>

  <circle cx="412" cy="366" r="4" fill="#22C55E">
    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.8s"
      begin="0.6s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- command response -->

  <text
    x="48"
    y="400"
    class="mono"
    font-size="12"
    fill="#38BDF8">

    &gt; CURRENT MODE:

  </text>

  <text
    x="186"
    y="400"
    class="mono"
    font-size="12"
    fill="#F8FAFC">

    BUILDING

  </text>

  <rect
    x="278"
    y="390"
    width="7"
    height="14"
    fill="#22D3EE">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- =====================================================
       CURRENT FOCUS
  ====================================================== -->

  <text
    x="42"
    y="458"
    class="label"
    fill="#64748B">

    CURRENT FOCUS

  </text>


  <text
    x="183"
    y="458"
    class="display"
    font-size="15"
    font-weight="700"
    letter-spacing="1"
    fill="#F8FAFC">

    AI / LLM SYSTEMS

  </text>


  <!-- animated bottom line -->

  <rect
    x="42"
    y="474"
    width="0"
    height="2"
    rx="1"
    fill="url(#lineGradient)">

    <animate
      attributeName="width"
      values="0;280;620"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- =====================================================
       CORNER DETAILS
  ====================================================== -->

  <path
    d="M 28 82 L 28 68 L 42 68"
    fill="none"
    stroke="#38BDF8"
    stroke-width="2"
    opacity="0.6"
  />

  <path
    d="M 732 82 L 732 68 L 718 68"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="2"
    opacity="0.6"
  />

  <path
    d="M 28 418 L 28 432 L 42 432"
    fill="none"
    stroke="#38BDF8"
    stroke-width="2"
    opacity="0.4"
  />

  <path
    d="M 732 418 L 732 432 L 718 432"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="2"
    opacity="0.4"
  />

</svg>

<svg
  width="760"
  height="510"
  viewBox="0 0 760 510"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND                                             -->
    <!-- ===================================================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="510">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="ambientGlow">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <!-- Panel -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B172A" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="760" y2="510">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="28"
      height="28"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 28 0 L 0 0 0 28"
        stroke="#38BDF8"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>

    <!-- Soft glow -->
    <filter
      id="glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter
      id="strongGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="10"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- BASE                                                   -->
  <!-- ===================================================== -->

  <rect
    x="7"
    y="7"
    width="746"
    height="496"
    rx="22"
    fill="url(#bg)"
  />

  <!-- Futuristic grid -->
  <rect
    x="7"
    y="7"
    width="746"
    height="496"
    rx="22"
    fill="url(#grid)"
  />

  <!-- Ambient light -->
  <circle
    cx="650"
    cy="120"
    r="240"
    fill="url(#ambientGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.55;0.9;0.55"
      dur="7s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ===================================================== -->
  <!-- FRAME                                                   -->
  <!-- ===================================================== -->

  <rect
    x="7"
    y="7"
    width="746"
    height="496"
    rx="22"
    stroke="url(#borderGradient)"
    stroke-width="1.5"
  />

  <rect
    x="15"
    y="15"
    width="730"
    height="480"
    rx="17"
    stroke="#38BDF8"
    stroke-opacity="0.07"
  />


  <!-- ===================================================== -->
  <!-- SYSTEM HEADER                                          -->
  <!-- ===================================================== -->

  <circle
    cx="38"
    cy="39"
    r="5"
    fill="#22C55E"
    filter="url(#glow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="52"
    y="44"
    fill="#86EFAC"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="1.5"
  >
    SYSTEM ONLINE
  </text>

  <text
    x="650"
    y="44"
    fill="#475569"
    font-family="Consolas, monospace"
    font-size="9"
    letter-spacing="1"
  >
    PROFILE_01
  </text>

  <line
    x1="32"
    y1="62"
    x2="728"
    y2="62"
    stroke="#38BDF8"
    stroke-opacity="0.13"
  />


  <!-- ===================================================== -->
  <!-- INTRO                                                  -->
  <!-- ===================================================== -->

  <text
    x="38"
    y="101"
    fill="#64748B"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="1.5"
  >
    HELLO, I'M
  </text>


  <!-- ===================================================== -->
  <!-- TYPING NAME                                            -->
  <!-- ===================================================== -->

  <!-- Glow behind name -->
  <text
    x="36"
    y="153"
    fill="#22D3EE"
    opacity="0.18"
    filter="url(#strongGlow)"
    font-family="Trebuchet MS, Segoe UI, Arial, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="3"

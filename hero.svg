    font-size="48"
    font-weight="700"
    letter-spacing="3"
  >
    NISHANT
  </text>

  <!-- Typing reveal -->
  <clipPath id="nameClip">
    <rect
      x="35"
      y="105"
      width="0"
      height="65"
    >
      <animate
        attributeName="width"
        values="0;0;75;150;230;310;390;430;430"
        keyTimes="0;0.12;0.20;0.28;0.36;0.44;0.52;0.60;1"
        dur="3.8s"
        repeatCount="indefinite"
      />
    </rect>
  </clipPath>

  <!-- Cursor -->
  <rect
    x="475"
    y="116"
    width="3"
    height="45"
    rx="1"
    fill="#22D3EE"
    filter="url(#glow)"
  >
    <animate
      attributeName="opacity"
      values="1;1;0;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="x"
      values="42;80;145;205;270;330;395;475"
      keyTimes="0;0.12;0.22;0.32;0.42;0.52;0.62;1"
      dur="3.8s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ===================================================== -->
  <!-- IDENTITY                                               -->
  <!-- ===================================================== -->

  <text
    x="40"

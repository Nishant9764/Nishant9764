  </text>

  <text
    x="565"
    y="324"
    fill="#64748B"
    font-family="Consolas, monospace"
    font-size="9"
  >
    AGENTS
  </text>

  <text
    x="625"
    y="324"
    fill="#334155"
    font-family="Consolas, monospace"
    font-size="9"
  >

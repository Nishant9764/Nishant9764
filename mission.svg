<svg
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="48%" stop-color="#080A1C"/>
      <stop offset="100%" stop-color="#11051D"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <linearGradient id="cyanPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pinkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect
    width="1200"
    height="430"
    rx="22"
    fill="url(#bg)"
  />

  <!-- subtle technical grid -->

  <g opacity="0.07" stroke="#6EE7FF" stroke-width="1">

    <path d="M0 80H1200"/>
    <path d="M0 160H1200"/>
    <path d="M0 240H1200"/>
    <path d="M0 320H1200"/>
    <path d="M0 400H1200"/>

    <path d="M100 0V430"/>
    <path d="M200 0V430"/>
    <path d="M300 0V430"/>
    <path d="M400 0V430"/>
    <path d="M500 0V430"/>
    <path d="M600 0V430"/>
    <path d="M700 0V430"/>
    <path d="M800 0V430"/>
    <path d="M900 0V430"/>
    <path d="M1000 0V430"/>
    <path d="M1100 0V430"/>

  </g>


  <!-- atmospheric light -->

  <circle
    cx="1050"
    cy="60"
    r="150"
    fill="#7C3AED"
    opacity="0.045"
  />

  <circle
    cx="120"
    cy="390"
    r="130"
    fill="#00E5FF"
    opacity="0.035"
  />


  <!-- =====================================================
       OUTER FRAME
  ====================================================== -->

  <rect
    x="14"
    y="14"
    width="1172"
    height="402"
    rx="18"
    stroke="url(#cyanPurple)"
    stroke-opacity="0.5"
    stroke-width="1.5"
  />

  <path
    d="M35 14H220"
    stroke="#00E5FF"
    stroke-width="3"
    filter="url(#cyanGlow)"
  />

  <path
    d="M980 416H1165"
    stroke="#FF3CAC"
    stroke-width="3"

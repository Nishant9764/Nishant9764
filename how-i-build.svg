  </text>


  <!-- =========================
       LOWER PRINCIPLE PANEL
  ========================== -->

  <rect
    x="72"
    y="355"
    width="1056"
    height="88"
    rx="12"
    fill="#090F1B"
    stroke="#1A2941"

    ENGINEERING MINDSET
  </text>

  <text
    x="72"
    y="134"
    fill="#77829B"
    font-family="monospace"
    font-size="12"
  >
    TURNING IDEAS INTO SYSTEMS — ONE LAYER AT A TIME
  </text>


  <!-- =========================
       STATUS
  ========================== -->

  <rect
    x="1015"
    y="66"
    width="113"
    height="28"
    rx="14"
    fill="#0B1525"
    stroke="#19314B"
  />

  <circle
    cx="1033"
    cy="80"
    r="4"
    fill="#00E5FF"
    filter="url(#cyanGlow)"

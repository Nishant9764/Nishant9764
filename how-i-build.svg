  <text
    x="500"
    y="240"
    text-anchor="middle"
    fill="#7C8AFF"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    03
  </text>

  <text
    x="500"
    y="290"
    text-anchor="middle"
    fill="#F4F7FF"
    font-family="monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="1"
  >
    BUILD
  </text>

  <text
    x="500"
    y="311"
    text-anchor="middle"
    fill="#68758F"
    font-family="monospace"
    font-size="9"
  >
    SIMPLE FIRST
  </text>


  <!-- =========================
       NODE 04
  ========================== -->

  <circle
    cx="690"
    cy="235"
    r="27"
    fill="#111124"
    stroke="#8D67FF"
    stroke-width="1.5"

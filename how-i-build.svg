  <text
    x="1070"
    y="240"
    text-anchor="middle"
    fill="#FF68D9"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    06
  </text>

  <text
    x="1070"
    y="290"
    text-anchor="middle"
    fill="#F4F7FF"
    font-family="monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="1"

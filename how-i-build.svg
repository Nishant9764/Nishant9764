<svg
  width="1200"
  height="500"
  viewBox="0 0 1200 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- =========================
         BACKGROUND GRID
    ========================== -->

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        stroke="#17233D"
        stroke-width="1"
      />
    </pattern>

    <!-- =========================
         GLOWS
    ========================== -->

    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1200"
      y2="0"
    >
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>

    <linearGradient
      id="nodeGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>

  </defs>


  <!-- =========================
       CONTINUOUS BACKGROUND
  ========================== -->

  <rect
    width="1200"
    height="500"
    fill="#070B16"
  />

  <rect
    width="1200"
    height="500"
    fill="url(#grid)"
    opacity="0.42"
  />


  <!-- =========================
       TOP CONNECTION
       Continues from Projects
  ========================== -->

  <path
    d="M 600 0
       L 600 28
       C 600 40 588 48 576 48
       L 420 48"
    stroke="#00E5FF"
    stroke-width="1.5"
    opacity="0.8"
    filter="url(#cyanGlow)"
  />

  <circle
    cx="600"
    cy="28"
    r="3"
    fill="#00E5FF"
    filter="url(#cyanGlow)"
  />


  <!-- =========================
       SECTION HEADER
  ========================== -->

  <text
    x="72"
    y="75"
    fill="#00E5FF"
    font-family="monospace"
    font-size="13"
    letter-spacing="3"
  >
    05 / HOW I BUILD
  </text>

  <text
    x="72"
    y="108"
    fill="#F4F7FF"
    font-family="Arial, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="1"
